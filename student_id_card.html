<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生証ジェネレーター</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- CSSの読み込み -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/student_id_card.css">
</head>
<body>
  <!-- 共通ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <div class="school-badge">
        <span class="badge-icon">🌻</span>
        <span class="badge-text">PRIVATE NATSUZORA ACADEMY</span>
      </div>
      <h1 class="header-title">夏空学園 学務課</h1>
      <p class="header-subtitle">学生証ジェネレーター</p>
    </div>
    <nav class="header-nav">
      <a href="index.html">🏫 ポータル</a>
      <a href="student_id_card.html" class="active">🏛️ 学務課（学生証）</a>
      <a href="library.html">📚 図書室</a>
    </nav>
  </header>

  <div class="app-container">
    <!-- 入力フォームエリア -->
    <div class="form-panel">
      <h2>学生証 情報入力</h2>

      <div class="form-group">
        <label for="input-photo">証明写真（画像ファイル）</label>
        <input type="file" id="input-photo" accept="image/*">
      </div>

      <div class="form-group">
        <label for="input-school">学校名</label>
        <input type="text" id="input-school" value="夏空学園 ">
      </div>

      <div class="form-group">
        <label for="input-sub">英字サブテキスト</label>
        <input type="text" id="input-sub" value="STUDENT ID CARD">
      </div>

      <div class="form-group">
        <label for="input-name">氏名</label>
        <input type="text" id="input-name" value="user name">
      </div>

      <div class="form-group">
        <label for="input-id">学籍番号</label>
        <input type="text" id="input-id" value="9999番">
      </div>

      <div class="form-group">
        <label for="input-birthday">生年月日</label>
        <input type="text" id="input-birthday" value="20xx年 xx月 xx日">
      </div>

      <div class="form-group">
        <label for="input-department">所属</label>
        <input type="text" id="input-department" value="普通科">
      </div>

      <div class="form-group">
        <label for="input-grade">学年</label>
        <input type="text" id="input-grade" value="３年生">
      </div>

      <div class="form-group">
        <label for="input-expiry">有効期限</label>
        <input type="text" id="input-expiry" value="夏が来なくなるまで">
      </div>
    </div>

    <!-- プレビューエリア -->
    <div class="preview-panel">
      <div class="preview-header">
        <span class="preview-title">リアルタイムプレビュー</span>
        <button id="btn-download" style="padding: 6px 14px; background: #6366f1; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">画像を保存</button>
      </div>

      <!-- 学生証カード本体 -->
      <div id="card-wrapper" style="width: 100%; display: flex; justify-content: center; overflow: hidden;">
        <div class="id-card" id="card">
          <div class="school-name" id="disp-school">夏空学園</div>
          <div class="school-sub" id="disp-sub">STUDENT ID CARD</div>

          <!-- 証明写真 -->
          <img class="profile-photo" id="disp-photo" alt="証明写真">

          <div class="field-value val-name" id="disp-name">user name</div>
          <div class="field-value val-id" id="disp-id">9999番</div>
          <div class="field-value val-birthday" id="disp-birthday">20xx年 xx月 xx日</div>
          <div class="field-value val-department" id="disp-department">普通科</div>
          <div class="field-value val-grade" id="disp-grade">３年生</div>
          <div class="field-value val-expiry" id="disp-expiry">夏が来なくなるまで</div>
        </div>
      </div>
    </div>
  </div>

  <!-- リアルタイム反映用スクリプト -->
  <script>
    // テキスト入力の連動マッピング（フォームID: カード内ID）
    const textFields = {
      'input-school': 'disp-school',
      'input-sub': 'disp-sub',
      'input-name': 'disp-name',
      'input-id': 'disp-id',
      'input-birthday': 'disp-birthday',
      'input-department': 'disp-department',
      'input-grade': 'disp-grade',
      'input-expiry': 'disp-expiry'
    };

    // テキストが打ち込まれるたびにリアルタイム更新
    Object.keys(textFields).forEach(inputId => {
      const inputEl = document.getElementById(inputId);
      const targetEl = document.getElementById(textFields[inputId]);

      inputEl.addEventListener('input', () => {
        targetEl.textContent = inputEl.value;

        // 学園名の文字数に応じて英字の位置を自動調整
        if (inputId === 'input-school') {
          adjustSubPosition();
        }
      });
    });

    // 学園名の長さが変わっても被らないように英字のleft位置を調整
    function adjustSubPosition() {
      const schoolEl = document.getElementById('disp-school');
      const subEl = document.getElementById('disp-sub');
      const schoolRect = schoolEl.offsetWidth;
      subEl.style.left = (170 + schoolRect + 20) + 'px';
    }
    // 初回実行
    adjustSubPosition();

    // 写真のアップロード処理（Canvasで比率を維持したまま中央トリミング）
    const inputPhoto = document.getElementById('input-photo');
    const dispPhoto = document.getElementById('disp-photo');

    inputPhoto.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const targetW = 620;
            const targetH = 740;
            const targetRatio = targetW / targetH;
            const imgRatio = img.width / img.height;

            let sx, sy, sWidth, sHeight;

            if (imgRatio > targetRatio) {
              sHeight = img.height;
              sWidth = img.height * targetRatio;
              sx = (img.width - sWidth) / 2;
              sy = 0;
            } else {
              sWidth = img.width;
              sHeight = img.width / targetRatio;
              sx = 0;
              sy = (img.height - sHeight) / 2;
            }

            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);

            dispPhoto.src = canvas.toDataURL('image/png');
            dispPhoto.style.display = 'block';
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        dispPhoto.src = '';
        dispPhoto.style.display = 'none';
      }
    });

    // ==========================================
    // 1. スマホ・画面幅に合わせた自動縮小処理
    // ==========================================
    function resizeCard() {
      const card = document.getElementById('card');
      const wrapper = document.getElementById('card-wrapper');
      if (!card || !wrapper) return;

      const screenWidth = window.innerWidth - 30;
      const availableWidth = Math.min(wrapper.clientWidth || screenWidth, screenWidth);
      const scale = Math.min(1, availableWidth / 900);

      card.style.transform = `scale(${scale})`;
      wrapper.style.height = `${600 * scale}px`;
    }

    window.addEventListener('resize', resizeCard);
    window.addEventListener('orientationchange', resizeCard);
    window.addEventListener('DOMContentLoaded', resizeCard);
    resizeCard();

    // ==========================================
    // 2. 画像保存（ダウンロード）処理
    // ==========================================
    document.getElementById('btn-download').addEventListener('click', () => {
      const card = document.getElementById('card');

      const currentTransform = card.style.transform;
      card.style.transform = 'none';

      html2canvas(card, { scale: 2 }).then(canvas => {
        card.style.transform = currentTransform;

        const link = document.createElement('a');
        link.download = 'student-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
