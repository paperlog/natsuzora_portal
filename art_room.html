<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏空学園 美術室 | ファンアートギャラリー</title>

  <!-- CSSの読み込み -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/art_room.css">
</head>
<body>

  <!-- 共通ヘッダー -->
  {% include header.html %}

  <main class="page-container">

    <!-- 廊下展示（渡り廊下）への特別扉案内 -->
    <div class="hallway-entrance-card">
      <div>
        <h2 class="hallway-title">
          <span>🚪</span> 美術室の奥の扉：渡り廊下展示
        </h2>
        <p class="hallway-desc">
          作品を額縁に入れて上から順番にダイナミックに鑑賞できる特設回廊です。
        </p>
      </div>
      <a href="art_hallway.html" class="hallway-btn">
        廊下展示へ行く →
      </a>
    </div>

    <!-- ステータスバー -->
    <div class="gallery-topbar">
      <div class="status-box">
        <span class="status-dot"></span>
        <span id="galleryCount">作品を読み込み中…</span>
      </div>
      <div class="sort-box">
        <label for="sortSelect">並び順:</label>
        <select id="sortSelect" onchange="changeSort(this.value)">
          <option value="newest" selected>新しい順</option>
          <option value="oldest">古い順</option>
        </select>
      </div>
    </div>

    <!-- ギャラリーグリッド -->
    <div class="gallery-grid" id="galleryGrid">
      <div class="loading-box">art.json を読み込んでいます…</div>
    </div>
  </main>

  <!-- 共通フッター -->
  {% include footer.html %}

  <script>
let artList = [];
let sortOrder = 'newest';
let currentPage = 1;
const ITEMS_PER_PAGE = 12; // 1ページあたりの表示件数

async function initGallery() {
  const grid = document.getElementById('galleryGrid');
  const countEl = document.getElementById('galleryCount');

  try {
    const res = await fetch('./art.json?t=' + Date.now());
    if (!res.ok) throw new Error('art.json の取得に失敗しました');
    artList = await res.json();
  } catch (err) {
    console.error(err);
    countEl.textContent = '読み込み失敗';
    grid.innerHTML = `
      <div class="empty-notice">
        <p>作品データ（art.json）を取得できませんでした。</p>
        <p class="empty-notice-sub">ルート直下に art.json が存在するか確認してください。</p>
      </div>`;
    return;
  }

  renderGallery();
}

function changeSort(order) {
  sortOrder = order;
  currentPage = 1; // ソート変更時は1ページ目に戻す
  renderGallery();
}

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  const countEl = document.getElementById('galleryCount');

  if (!artList || artList.length === 0) {
    countEl.textContent = '展示数: 0点';
    grid.innerHTML = '<div class="empty-notice">現在展示中の作品はありません。</div>';
    renderPagination(0);
    return;
  }

  countEl.innerHTML = `全 <strong>${artList.length}</strong> 点 展示中`;

  // 並び替え
  const sorted = [...artList].sort((a, b) => {
    const dateA = new Date(a.date || 0).getTime();
    const dateB = new Date(b.date || 0).getTime();
    return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
  });

  // 現在のページの分だけスライス
  const totalPages = Math.ceil(sorted.length / ITEMS_PER_PAGE);
  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const pageItems = sorted.slice(start, start + ITEMS_PER_PAGE);

  grid.innerHTML = '';

  pageItems.forEach(art => {
    const displayTitle = art.title || `${art.author || '夏空あさひ'}のアート`;
    const card = document.createElement('article');
    card.className = 'art-card';

    const targetUrl = art.url ? escapeHtml(art.url) : '#';
    const hasUrl = Boolean(art.url);

    card.innerHTML = `
      <a href="${targetUrl}" ${hasUrl ? 'target="_blank" rel="noopener noreferrer"' : ''} class="art-img-link" title="${hasUrl ? 'Xの元ポストを開く' : ''}">
        <div class="art-thumb-container">
          <img src="${art.image}" alt="${escapeHtml(displayTitle)}" loading="lazy" class="art-thumb">
          <div class="thumb-overlay">
            <span class="overlay-badge">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              ポストを開く ↗
            </span>
          </div>
        </div>
      </a>
      <div class="art-meta">
        <h3 class="art-title">${escapeHtml(displayTitle)}</h3>
        <div class="art-author-row">
          <span class="art-author">作者: <strong>${escapeHtml(art.author || '匿名生徒')}</strong></span>
          ${hasUrl ? `<a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="link-x-icon" title="Xで見る">↗</a>` : ''}
        </div>
        ${art.comment ? `<p class="art-comment">${escapeHtml(art.comment)}</p>` : ''}
        <div class="art-footer">
          <span class="art-date">${art.date || ''}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  renderPagination(totalPages);
}

// ページ送りUIの描画
function renderPagination(totalPages) {
  let nav = document.getElementById('galleryPagination');
  if (!nav) {
    nav = document.createElement('div');
    nav.id = 'galleryPagination';
    nav.className = 'gallery-pagination';
    const grid = document.getElementById('galleryGrid');
    grid.parentNode.insertBefore(nav, grid.nextSibling);
  }

  if (totalPages <= 1) {
    nav.innerHTML = '';
    return;
  }

  let html = '';
  // 「前へ」ボタン
  if (currentPage > 1) {
    html += `<button onclick="goToPage(${currentPage - 1})" class="pagination-btn">← 前へ</button>`;
  }

  // ページ番号
  for (let i = 1; i <= totalPages; i++) {
    const isCurrent = i === currentPage;
    html += `
      <button onclick="goToPage(${i})" class="pagination-btn ${isCurrent ? 'active' : ''}">${i}</button>
    `;
  }

  // 「次へ」ボタン
  if (currentPage < totalPages) {
    html += `<button onclick="goToPage(${currentPage + 1})" class="pagination-btn">次へ →</button>`;
  }

  nav.innerHTML = html;
}

function goToPage(page) {
  currentPage = page;
  renderGallery();
  window.scrollTo({ top: 0, behavior: 'smooth' }); // ページ変更時に上部へスクロール
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

window.addEventListener('DOMContentLoaded', initGallery);
  </script>
</body>
</html>
